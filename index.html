<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>AI Prompt Üretici</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; max-width: 600px; margin: auto; }
        .box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        label { font-weight: bold; color: #333; }
        button { background: #4CAF50; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px;}
        button:hover { background: #45a049; }
        .result { background: #e2e8f0; padding: 15px; margin-top: 15px; border-radius: 4px; word-break: break-all; min-height: 20px; }
        .en-result { background: #d4edda; font-weight: bold; color: #155724; }
    </style>
</head>
<body>

<div class="box">
    <h2>🎨 AI Prompt Üretici</h2>
    
    <label>Kim / Ne:</label>
    <input type="text" id="kisi" placeholder="Örn: A green rabbit">

    <label>Ne Yapıyor?:</label>
    <input type="text" id="eylem" placeholder="Örn: eating strawberries">

    <label>Nerede?:</label>
    <input type="text" id="yer" placeholder="Örn: in a strawberry field">

    <label>Nasıl Görünüyor?:</label>
    <input type="text" id="gorunum" placeholder="Örn: cute, fluffy">

    <label>Kamera / Kadraj:</label>
    <input type="text" id="kamera" placeholder="Örn: full body shot">

    <label>Stil:</label>
    <input type="text" id="stil" placeholder="Örn: realistic photography">

    <button onclick="uret()">Prompt Oluştur</button>

    <h3>Türkçe / Anlamlı Özet:</h3>
    <div class="result" id="trSonuc">-</div>

    <h3>İngilizce Prompt (Kopyala & Yapıştır):</h3>
    <div class="result en-result" id="enSonuc">-</div>
</div>

<script>
    function uret() {
        let kisi = document.getElementById('kisi').value.trim();
        let eylem = document.getElementById('eylem').value.trim();
        let yer = document.getElementById('yer').value.trim();
        let gorunum = document.getElementById('gorunum').value.trim();
        let kamera = document.getElementById('kamera').value.trim();
        let stil = document.getElementById('stil').value.trim();

        // İngilizce Prompt Oluşturma (Aralarına virgül koyarak birleştirir)
        let enParcalar = [kisi, eylem, yer, gorunum, kamera, stil].filter(Boolean);
        let enSonuc = enParcalar.join(", ");

        // Ekrana Yazdır
        document.getElementById('trSonuc').innerText = enSonuc ? "Oluşturulan Komut Hazır!" : "Lütfen en az bir alanı doldurun.";
        document.getElementById('enSonuc').innerText = enSonuc || "-";
    }
</script>

</body>
</html>
