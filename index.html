<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro AI Prompt Stüdyosu (Canlı Çeviri)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 700px; margin: auto; }
        .box { background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0 15px 0; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #38bdf8; }
        label { font-weight: 600; color: #94a3b8; display: block; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        button { background: #0284c7; color: white; padding: 14px 20px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        .result-container { margin-top: 20px; position: relative; }
        .en-result { background: #090d16; padding: 15px; border-radius: 6px; border: 1px solid #22c55e; color: #4ade80; font-family: monospace; font-size: 15px; word-break: break-all; min-height: 30px; }
        .copy-btn { background: #22c55e; margin-top: 10px; padding: 10px; font-size: 14px; }
        .copy-btn:hover { background: #16a34a; }
        .grid-2 { display: flex; gap: 15px; }
        .grid-2 > div { flex: 1; }
        .loading { color: #facc15 !important; font-style: italic; }
    </style>
</head>
<body>

<div class="box">
    <h2>🚀 Pro AI Prompt Stüdyosu (Canlı Çeviri)</h2>
    
    <label>Kim / Ne:</label>
    <input type="text" id="kisi" placeholder="Örn: gelecekteki uçan bir araba">

    <label>Ne Yapıyor?:</label>
    <input type="text" id="eylem" placeholder="Örn: gökdelenler arasında yarışıyor">

    <label>Nerede?:</label>
    <input type="text" id="yer" placeholder="Örn: neon ışıklı bir şehirde">

    <div class="grid-2">
        <div>
            <label>Nasıl Görünüyor? / Duygu:</label>
            <select id="gorunum">
                <option value="">Seçiniz (Normal)</option>
                <option value="happy, smiling">Mutlu, Gülüyor</option>
                <option value="sad, crying">Üzgün, Ağlıyor</option>
                <option value="cute, fluffy">Sevimli, Tüylü</option>
                <option value="cool, charismatic">Havalı, Karizmatik</option>
                <option value="mysterious, glowing eyes">Gizemli, Parlayan Gözler</option>
            </select>
        </div>
        <div>
            <label>Kamera / Kadraj:</label>
            <select id="kamera">
                <option value="full body shot">Tam Boy (Full Body)</option>
                <option value="medium shot">Yarım Boy (Medium Shot)</option>
                <option value="close-up portrait">Yakın Plan (Close-up)</option>
                <option value="wide angle, epic landscape">Geniş Açı / Manzara</option>
                <option value="bird's eye view">Kuş Bakışı</option>
            </select>
        </div>
    </div>

    <div class="grid-2">
        <div>
            <label>Stil / Tarz:</label>
            <select id="stil">
                <option value="realistic photography, 8k, highly detailed">Gerçekçi Fotoğraf</option>
                <option value="cinematic lighting, movie scene, dramatic">Sinematik Film Sahnesi</option>
                <option value="anime style, studio ghibli, vibrant">Anime / Çizgi Film</option>
                <option value="3d render, Pixar style, octane render">3D Render (Pixar Tarzı)</option>
                <option value="cyberpunk style, neon lights, futuristic">Cyberpunk / Neon</option>
                <option value="oil painting, classical art">Yağlı Boya Tablo</option>
                <option value="fantasy art, magical, ethereal">Fantastik / Büyülü</option>
            </select>
        </div>
        <div>
            <label>Işıklandırma (Lighting):</label>
            <select id="isik">
                <option value="">Normal Işık</option>
                <option value="golden hour lighting, warm sunlight">Altın Saat (Gün Batımı Işığı)</option>
                <option value="dramatic studio lighting, rim light">Stüdyo Işığı (Dramatik)</option>
                <option value="neon glow, cyberpunk lighting">Neon Parlaması</option>
                <option value="dark moody lighting, cinematic shadows">Karanlık / Moody Işık</option>
            </select>
        </div>
    </div>

    <label>Format / En Boy Oranı (Aspect Ratio):</label>
    <select id="oran">
        <option value="--ar 16:9">16:9 (Yatay / YouTube / Sinema)</option>
        <option value="--ar 9:16">9:16 (Dikey / Telefon / TikTok / Story)</option>
        <option value="--ar 1:1">1:1 (Kare / Instagram Post)</option>
        <option value="--ar 4:3">4:3 (Klasik Fotoğraf)</option>
    </select>

    <button onclick="uret()">Prompt Oluştur ve Çevir</button>

    <div class="result-container">
        <label>Hazır İngilizce Prompt:</label>
        <div class="en-result" id="enSonuc">Komut üretmek için butona basın...</div>
        <button class="copy-btn" onclick="kopyala()">📋 Kopyala</button>
    </div>
</div>

<script>
    // Ücretsiz ve API Anahtarı gerektirmeyen çeviri fonksiyonu
    async function translateText(text) {
        if (!text.trim()) return "";
        try {
            let url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=tr|en`;
            let response = await fetch(url);
            let data = await response.json();
            if (data && data.responseData && data.responseData.translatedText) {
                return data.responseData.translatedText;
            }
        } catch (error) {
            console.error("Çeviri hatası:", error);
        }
        return text; // Hata olursa orijinalini döndür
    }

    async function uret() {
        let sonucKutusu = document.getElementById('enSonuc');
        sonucKutusu.innerText = "Çevriliyor ve oluşturuluyor... Lütfen bekleyin ⏳";
        sonucKutusu.classList.add("loading");

        // Girdileri al
        let h_kisi = document.getElementById('kisi').value;
        let h_eylem = document.getElementById('eylem').value;
        let h_yer = document.getElementById('yer').value;

        // Eşzamanlı olarak API üzerinden Türkçe'den İngilizceye çevir
        let kisi = await translateText(h_kisi);
        let eylem = await translateText(h_eylem);
        let yer = await translateText(h_yer);

        let gorunum = document.getElementById('gorunum').value;
        let kamera = document.getElementById('kamera').value;
        let stil = document.getElementById('stil').value;
        let isik = document.getElementById('isik').value;
        let oran = document.getElementById('oran').value;

        // Tüm parçaları birleştir
        let parcalar = [kisi, eylem, yer, gorunum, kamera, stil, isik, oran].filter(Boolean);
        let sonuc = parcalar.join(", ");

        sonucKutusu.classList.remove("loading");
        sonucKutusu.innerText = sonuc || "Lütfen en az bir alanı doldurun!";
    }

    function kopyala() {
        let metin = document.getElementById('enSonuc').innerText;
        if(metin.includes("Lütfen") || metin.includes("Çevriliyor")) return;
        navigator.clipboard.writeText(metin).then(() => {
            alert("Prompt kopyalandı! Midjourney'e yapıştırabilirsin 🚀");
        });
    }
</script>

</body>
</html>
