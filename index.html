<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>AI Prompt Üretici</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; max-width: 650px; margin: auto; }
        .box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        label { font-weight: bold; color: #333; display: block; margin-top: 10px; }
        button { background: #4CAF50; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 15px;}
        button:hover { background: #45a049; }
        .result { background: #e2e8f0; padding: 15px; margin-top: 15px; border-radius: 4px; word-break: break-all; min-height: 20px; }
        .en-result { background: #d4edda; font-weight: bold; color: #155724; font-size: 16px; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>

<div class="box">
    <h2>🎨 Gelişmiş AI Prompt Üretici</h2>
    
    <label>Kim / Ne (Örn: sevimli bir kedi):</label>
    <input type="text" id="kisi" placeholder="Örn: a cute cat">

    <label>Ne Yapıyor? (Örn: gitar çalıyor):</label>
    <input type="text" id="eylem" placeholder="Örn: playing guitar">

    <label>Nerede? (Örn: sahnede):</label>
    <input type="text" id="yer" placeholder="Örn: on a stage">

    <label>Nasıl Görünüyor? / Duygu:</label>
    <select id="gorunum">
        <option value="">Seçiniz (Normal)</option>
        <option value="happy, smiling">Mutlu, Gülüyor</option>
        <option value="sad, crying">Üzgün, Ağlıyor</option>
        <option value="angry, fierce">Kızgın, Öfkeli</option>
        <option value="surprised, shocked">Şaşırmış</option>
        <option value="cute, fluffy">Sevimli, Tüylü</option>
        <option value="cool, charismatic">Havalı, Karizmatik</option>
    </select>

    <label>Kamera / Kadraj:</label>
    <select id="kamera">
        <option value="">Seçiniz (Varsayılan)</option>
        <option value="full body shot">Tam Boy (Full Body)</option>
        <option value="medium shot">Yarım Boy (Medium Shot)</option>
        <option value="close-up portrait">Yakın Plan Portre (Close-up)</option>
        <option value="extreme close-up">Sadece Surat (Extreme Close-up)</option>
        <option value="wide angle, epic landscape">Geniş Açı / Manzara</option>
        <option value="bird's eye view">Kuş Bakışı</option>
    </select>

    <label>Stil / Tarz:</label>
    <select id="stil">
        <option value="">Seçiniz (Gerçekçi)</option>
        <option value="realistic photography, 8k, highly detailed">Gerçekçi Fotoğraf (Realistic)</option>
        <option value="anime style, 2d animation, studio ghibli">Anime / Çizgi Film</option>
        <option value="cinematic lighting, movie scene, dramatic">Sinematik / Film Sahnesi</option>
        <option value="oil painting, classical art">Yağlı Boya Tablo</option>
        <option value="cyberpunk style, neon lights, futuristic">Cyberpunk / Neon</option>
        <option value="3d render, Pixar style, octane render">3D Render (Pixar Tarzı)</option>
        <option value="watercolor painting">Sulu Boya</option>
        <option value="fantasy art, magical">Fantastik / Büyülü</option>
    </select>

    <button onclick="uret()">Prompt Oluştur</button>

    <h3>İngilizce Prompt (Kopyala & Yapıştır):</h3>
    <div class="result en-result" id="enSonuc">Henüz prompt oluşturulmadı...</div>
</div>

<script>
    // Basit Türkçe -> İngilizce kelime çevirisi (Kutulara Türkçe yazılırsa diye)
    const sozluk = {
        "kedi": "cat", "kopek": "dog", "köpek": "dog", "kurt": "wolf",
        "cocuk": "child", "çocuk": "child", "kadin": "woman", "kadın": "woman", "adam": "man"
    };

    function cevir(metin) {
        let t = metin.toLowerCase().trim();
        return sozluk[t] || t;
    }

    function uret() {
        let kisi = cevir(document.getElementById('kisi').value);
        let eylem = cevir(document.getElementById('eylem').value);
        let yer = cevir(document.getElementById('yer').value);
        let gorunum = document.getElementById('gorunum').value;
        let kamera = document.getElementById('kamera').value;
        let stil = document.getElementById('stil').value;

        // Tüm parçaları diziye atıp boş olmayanları virgülle birleştiriyoruz
        let parcalar = [kisi, eylem, yer, gorunum, kamera, stil].filter(Boolean);
        
        let sonuc = parcalar.join(", ");

        if(sonuc) {
            document.getElementById('enSonuc').innerText = sonuc;
        } else {
            document.getElementById('enSonuc').innerText = "Lütfen en az bir alanı doldurun veya seçin!";
        }
    }
</script>

</body>
</html>
